name: Idea
description: Suggest a change to Float Space
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Float Space keeps working without layout changes; ideas that need a layout edit or a Herdr change are welcome, just say so.
    validations:
      required: true
